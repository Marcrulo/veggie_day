name: Weekly canteen menu email

on:
  schedule:
    # 15:00 UTC every Sunday (17:00 Danish summer time, 16:00 in winter).
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        default: true
      week:
        description: "0 = current week, 1 = next week"
        default: "1"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Preview the email in the log
        run: python notify.py --week "${{ inputs.week || 1 }}" --dry-run

      - name: Send
        if: ${{ inputs.dry_run != true }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notify.py --week "${{ inputs.week || 1 }}"
