name: Weekly canteen menu email

on:
  schedule:
    # 15:23 UTC every Sunday (17:23 Danish summer time, 16:23 in winter).
    # Deliberately not on the hour: GitHub queues scheduled jobs on shared
    # capacity and can drop them outright at peak times, which is the start of
    # every hour.
    - cron: "23 15 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        default: true
      week:
        description: "auto (picks the tab holding next Monday), or force 0 / 1"
        default: "auto"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Preview the email in the log
        run: python notify.py --week "${{ inputs.week || 'auto' }}" --dry-run

      # Server and mailing list live in the repo (notify.py, recipients.txt).
      # The app password is the only secret.
      - name: Send
        if: ${{ inputs.dry_run != true }}
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python notify.py --week "${{ inputs.week || 'auto' }}"
