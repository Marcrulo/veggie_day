name: Weekly canteen menu email

on:
  schedule:
    # 15:23 UTC every Sunday (17:23 Danish summer time, 16:23 in winter).
    # Deliberately not on the hour: GitHub queues scheduled jobs on shared
    # capacity and can drop them outright at peak times, which is the start of
    # every hour.
    - cron: "23 15 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        default: true
      week:
        description: "auto (picks the tab holding next Monday), or force 0 / 1"
        default: "auto"

env:
  # Kept here rather than in classify.py so the model can be swapped without
  # touching code. classify.py reads OLLAMA_MODEL and falls back to this value.
  OLLAMA_MODEL: "qwen3.5:9b"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      # --- Local model -----------------------------------------------------
      # Only needed when the site publishes a week with no VEGAN/VEGETARIAN/
      # FISH DAY prefixes. It is set up unconditionally because that costs a
      # few runner minutes, while working out in advance whether it is needed
      # would mean scraping the site twice. Nothing here needs a key: the model
      # runs on this runner, and classify.py talks to it over localhost.
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer registers a systemd service that runs as the `ollama`
          # user and keeps weights in /usr/share/ollama - which would hold port
          # 11434 and quietly bypass the cache below. Run our own server as the
          # runner user instead, so OLLAMA_MODELS is the path we cache.
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true

      # ~7.6GB of weights. Restoring beats re-downloading, but GitHub evicts
      # caches after 7 days of no access and this job runs every 7 days, so
      # expect an occasional miss - it just falls back to pulling.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama and load the model
        run: |
          export OLLAMA_MODELS="$HOME/.ollama/models"
          # nohup so the server outlives this step's shell - later steps need it.
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          # Poll rather than sleep blindly: the server is usually up in ~1s,
          # but a cold runner can take longer and a fixed sleep would either
          # waste time or flake.
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags >/dev/null \
            || { echo "Ollama did not come up"; exit 1; }
          ollama pull "$OLLAMA_MODEL"
          # Fail loudly here rather than let classify.py quietly mail an
          # untagged week because the weights never arrived.
          ollama list | grep -q "$OLLAMA_MODEL" \
            || { echo "$OLLAMA_MODEL is not available"; exit 1; }

      # Most weeks the site tags itself and the model is never asked, so a
      # manual run also classifies the untagged fixture to prove the model
      # works on this runner. Skipped on the schedule: it adds ~3 minutes.
      - name: Check the model on an untagged week
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          OLLAMA_LIVE: "1"
        run: python -m unittest -v tests.test_classify.TestLive
      # ---------------------------------------------------------------------

      - name: Preview the email in the log
        run: python notify.py --week "${{ inputs.week || 'auto' }}" --dry-run

      # Server and mailing list live in the repo (notify.py, recipients.txt).
      # The app password is still the only secret.
      - name: Send
        if: ${{ inputs.dry_run != true }}
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python notify.py --week "${{ inputs.week || 'auto' }}"
